name: release

# Cut a release by pushing a version tag:
#   git tag v0.2.0 && git push origin v0.2.0
# Builds the Tasks app natively for linux/amd64 and linux/arm64 via mdk
# (vendored SDL3 is compiled from source on the runner) and attaches the
# binaries plus SHA256SUMS.txt. Asset names match catalog.json:
# machin-tasks-linux-<arch> (no version in the filename).
#
# No headless smoke test: the binary is a GUI app and cannot meaningfully
# run without a display. ci.yml's `mdk check` covers encode-time errors;
# catalog.json sha256 is verified by `machin-365 install` on the user side.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create releases and upload assets

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config \
            libfreetype6-dev libharfbuzz-dev libgl1-mesa-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxinerama-dev libwayland-dev wayland-protocols \
            libxkbcommon-dev libxss-dev libxtst-dev

      - name: Install machin v0.142.0
        run: |
          curl -fsSL -o /tmp/machin \
            "https://github.com/javimosch/machin/releases/download/v0.142.0/machin-v0.142.0-linux-${{ matrix.arch }}"
          chmod +x /tmp/machin
          sudo mv /tmp/machin /usr/local/bin/machin

      - name: Fetch mdk + framework (sparse)
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/javimosch/machin-desktop.git /tmp/machin-desktop
          git -C /tmp/machin-desktop sparse-checkout set --skip-checks mdk framework

      - name: Build app binary
        run: |
          mkdir -p dist
          /tmp/machin-desktop/mdk build app/ -o "dist/machin-tasks-linux-${{ matrix.arch }}"
          file "dist/machin-tasks-linux-${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: machin-tasks-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # RELEASE GUARD, same shape as machin-bkn's release.yml: a tag push is
      # not a protected operation, so prove the tagged commit is on master
      # and that CI went green on it before anything is published.
      - name: Verify the tag is on master and CI passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA}"
          echo "tagged commit: $SHA"

          git fetch --quiet origin master

          if ! git merge-base --is-ancestor "$SHA" origin/master; then
            echo "::error::$SHA is not contained in origin/master — refusing to release a commit that is not on the default branch."
            exit 1
          fi
          echo "  on master: yes"

          CONCLUSION=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${SHA}&status=completed" \
            --jq '[.workflow_runs[] | select(.name == "ci")] | first | .conclusion // "none"')
          echo "  ci conclusion: $CONCLUSION"
          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::CI for $SHA is '${CONCLUSION}', not 'success' — refusing to release an unverified commit. Wait for CI, or fix it, then re-tag."
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          ( cd dist && sha256sum machin-tasks-* > SHA256SUMS.txt && ls -l )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "machin-tasks $TAG" \
              --generate-notes
          fi
